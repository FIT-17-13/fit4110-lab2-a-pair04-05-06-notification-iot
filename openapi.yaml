openapi: 3.1.0
info:
  title: Smart Campus — A7 Notification Service API
  version: 1.0.0
  description: |
    Hợp đồng API cho Notification Service (A7) của Smart Campus.
    Consumer chính là Core Business. Notification nhận alert và xếp hàng gửi đa kênh.
  contact:
    name: FIT4110 Team
    email: fit4110@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.smartcampus.local
    description: Class network placeholder
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: notifications
    description: Nhận và tra cứu thông báo
  - name: templates
    description: Quản lý template thông báo
  - name: channels
    description: Test kênh gửi
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: notification-service
                    time: '2026-05-15T09:00:00Z'

  /notifications:
    post:
      operationId: createNotification
      summary: Nhận alert và xếp hàng gửi thông báo
      description: |
        Consumer (Core Business) gọi endpoint này để gửi alert.
        Notification Service sẽ enqueue để xử lý gửi đa kênh.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
            examples:
              intrusionAlert:
                value:
                  alertId: ALT-20260515-001
                  severity: high
                  message: Unknown person detected near main gate
                  target:
                    type: team
                    teamCode: security_team
                  templateId: tpl-intrusion-alert
                  variables:
                    location: main_gate
                    cameraId: cam-01
                    timestamp: '2026-05-15T10:30:00Z'
      responses:
        '202':
          description: Alert đã được xếp hàng gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReceipt'
              examples:
                queued:
                  value:
                    notificationId: ntf-20260515-001
                    alertId: ALT-20260515-001
                    status: queued
                    channels: [telegram, email]
                    queuedAt: '2026-05-15T10:30:05Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listNotifications
      summary: Lấy danh sách thông báo
      description: Lấy danh sách thông báo với cursor-based pagination.
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              examples:
                firstPage:
                  value:
                    items:
                      - notificationId: ntf-20260515-001
                        alertId: ALT-20260515-001
                        severity: high
                        message: Unknown person detected near main gate
                        target:
                          type: team
                          teamCode: security_team
                        status: queued
                        queuedAt: '2026-05-15T10:30:05Z'
                        deliveredAt: null
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}:
    get:
      operationId: getNotificationById
      summary: Lấy chi tiết một thông báo
      description: Lấy chi tiết thông báo theo `notificationId`.
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Chi tiết thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates:
    post:
      operationId: createTemplate
      summary: Tạo template thông báo
      description: Tạo template nội dung theo kênh gửi.
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
            examples:
              intrusionTemplate:
                value:
                  templateId: tpl-intrusion-alert
                  channel: telegram
                  title: Intrusion alert
                  body: 'Alert: {{message}} at {{location}}'
      responses:
        '201':
          description: Template đã được tạo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{templateId}:
    patch:
      operationId: updateTemplate
      summary: Cập nhật template thông báo
      description: Cập nhật title/body của template.
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateRequest'
            examples:
              updateBody:
                value:
                  title: Intrusion alert (v2)
                  body: 'Alert: {{message}} at {{location}} (camera {{cameraId}})'
      responses:
        '200':
          description: Template đã được cập nhật
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /channels/test:
    post:
      operationId: testChannel
      summary: Test kênh gửi thông báo
      description: Gửi thử thông báo để kiểm tra cấu hình kênh.
      tags: [channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTestRequest'
            examples:
              telegramTest:
                value:
                  channel: telegram
                  target:
                    type: user
                    userId: u-001
                  message: 'This is a test notification.'
      responses:
        '200':
          description: Kênh gửi hoạt động
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: ID thông báo
      schema:
        type: string
        minLength: 6
    TemplateId:
      name: templateId
      in: path
      required: true
      description: ID template
      schema:
        type: string
        minLength: 4
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor cho phân trang
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Số bản ghi tối đa
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Thiếu hoặc sai token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Không đủ quyền
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Không tìm thấy resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Dữ liệu đúng JSON nhưng vi phạm nghiệp vụ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Lỗi hệ thống
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time

    NotificationSeverity:
      type: string
      enum: [low, medium, high, critical]

    NotificationStatus:
      type: string
      enum: [queued, sending, sent, failed]

    NotificationChannel:
      type: string
      enum: [telegram, email, discord, zalo, sms, console]

    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [alertId, severity, message, target]
      properties:
        alertId:
          type: string
          minLength: 3
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        message:
          type: string
          minLength: 3
          maxLength: 500
        target:
          $ref: '#/components/schemas/NotificationTarget'
        templateId:
          type: string
          minLength: 4
        variables:
          type: object
          additionalProperties: true
        requestedChannels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NotificationChannel'

    NotificationReceipt:
      type: object
      additionalProperties: false
      required: [notificationId, alertId, status, queuedAt]
      properties:
        notificationId:
          type: string
        alertId:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
        queuedAt:
          type: string
          format: date-time

    Notification:
      type: object
      additionalProperties: false
      required: [notificationId, alertId, severity, message, target, status, queuedAt]
      properties:
        notificationId:
          type: string
        alertId:
          type: string
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        message:
          type: string
        target:
          $ref: '#/components/schemas/NotificationTarget'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        queuedAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
        delivery:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannelResult'

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    NotificationTarget:
      oneOf:
        - $ref: '#/components/schemas/TeamTarget'
        - $ref: '#/components/schemas/UserTarget'
        - $ref: '#/components/schemas/WebhookTarget'
      discriminator:
        propertyName: type
        mapping:
          team: '#/components/schemas/TeamTarget'
          user: '#/components/schemas/UserTarget'
          webhook: '#/components/schemas/WebhookTarget'

    TeamTarget:
      type: object
      additionalProperties: false
      required: [type, teamCode]
      properties:
        type:
          type: string
          enum: [team]
        teamCode:
          type: string
          minLength: 3

    UserTarget:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type:
          type: string
          enum: [user]
        userId:
          type: string
          minLength: 3

    WebhookTarget:
      type: object
      additionalProperties: false
      required: [type, webhookUrl]
      properties:
        type:
          type: string
          enum: [webhook]
        webhookUrl:
          type: string
          format: uri

    NotificationChannelResult:
      oneOf:
        - $ref: '#/components/schemas/TelegramResult'
        - $ref: '#/components/schemas/EmailResult'
        - $ref: '#/components/schemas/DiscordResult'
        - $ref: '#/components/schemas/SmsResult'
        - $ref: '#/components/schemas/ZaloResult'
        - $ref: '#/components/schemas/ConsoleResult'
      discriminator:
        propertyName: channel
        mapping:
          telegram: '#/components/schemas/TelegramResult'
          email: '#/components/schemas/EmailResult'
          discord: '#/components/schemas/DiscordResult'
          sms: '#/components/schemas/SmsResult'
          zalo: '#/components/schemas/ZaloResult'
          console: '#/components/schemas/ConsoleResult'

    TelegramResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [telegram]
        status:
          type: string
          enum: [sent, failed]
        messageId:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time

    EmailResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [email]
        status:
          type: string
          enum: [sent, failed]
        recipient:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time

    DiscordResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [discord]
        status:
          type: string
          enum: [sent, failed]
        messageId:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time

    SmsResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [sms]
        status:
          type: string
          enum: [sent, failed]
        recipient:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time

    ZaloResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [zalo]
        status:
          type: string
          enum: [sent, failed]
        messageId:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time

    ConsoleResult:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel:
          type: string
          enum: [console]
        status:
          type: string
          enum: [sent, failed]
        sentAt:
          type: [string, 'null']
          format: date-time

    TemplateCreateRequest:
      type: object
      additionalProperties: false
      required: [templateId, channel, body]
      properties:
        templateId:
          type: string
          minLength: 4
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        title:
          type: string
        body:
          type: string
          minLength: 3

    TemplateUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        body:
          type: string
          minLength: 3

    ChannelTestRequest:
      type: object
      additionalProperties: false
      required: [channel, target, message]
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        target:
          $ref: '#/components/schemas/NotificationTarget'
        message:
          type: string
          minLength: 3

    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        timestamp:
          type: string
          format: date-time
